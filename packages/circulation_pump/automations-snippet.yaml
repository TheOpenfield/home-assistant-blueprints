# ============================================================
# DIESE AUTOMATIONEN ANS ENDE DEINER automations.yaml ANFÜGEN
# (nach dem letzten bestehenden "- id: ..." Block)
#
# Danach: Entwicklerwerkzeuge -> YAML-Konfiguration neu laden -> Automationen.
# Kein Core-Neustart nötig.
#
# Anzupassen an die eigene Installation:
#   switch.umwalzpumpe                  -> Steckdose der Zirkulationspumpe
#   person.jaybe / person.sari          -> die eigenen Personen
#   sensor.op13_vpn_next_alarm,
#   sensor.pixel_10a_next_alarm         -> Next-alarm-Sensoren der Companion-App
# ============================================================

- id: umwaelzpumpe_takt
  alias: Umwälzpumpe - Takt (Wecker, Wochenende, Abend, Ankunft)
  description: Warmwasser-Zirkulation für 3 min, nur wenn jemand daheim ist und
    frühestens 30 min nach dem letzten Start. Werktags 10 min vor und 20 min
    nach jedem Wecker, ohne Wecker und am Wochenende 7-10 Uhr stündlich,
    abends 18-22 Uhr stündlich, dazu bei Ankunft.
  triggers:
  - trigger: time_pattern
    minutes: /5
    id: takt
  - trigger: state
    entity_id:
    - person.jaybe
    - person.sari
    from: not_home
    to: home
    id: ankunft
  variables:
    wecker:
    - sensor: sensor.op13_vpn_next_alarm
      person: person.jaybe
    - sensor: sensor.pixel_10a_next_alarm
      person: person.sari
    phase: >-
      {%- set t = now() -%}
      {%- set hm = t.strftime('%H:%M') -%}
      {%- set werktag = t.isoweekday() <= 5 -%}
      {%- set ns = namespace(phase='', bedarf=false, heute=false) -%}
      {%- if trigger.id == 'ankunft' -%}
        {%- if trigger.from_state is not none and '05:00' <= hm < '23:00'
              and t - trigger.from_state.last_changed > timedelta(minutes=20) -%}
          {%- set ns.phase = 'ankunft' -%}
        {%- endif -%}
      {%- elif '18:00' <= hm < '22:00' -%}
        {%- set ns.phase = 'abend' -%}
      {%- elif werktag and '04:00' <= hm < '10:45' -%}
        {#- Wecker anwesender Personen: ein Lauf 10 min davor, einer 20 min
            danach. Die Fenster sind breiter als der 5-min-Takt, damit ein von
            der 30-min-Sperre blockierter Lauf nachgeholt wird.
            Nach dem Klingeln springt der Sensor auf den nächsten Wecker,
            deshalb gilt dann sein letzter Wechsel heute als Weckzeit.
            Ein Wecker unterdrückt die festen Zeiten, wenn die Person daheim
            ist oder erst nach dem Klingeln gegangen ist. -#}
        {%- set m = timedelta(minutes=1) -%}
        {%- for w in wecker -%}
          {%- set daheim = is_state(w.person, 'home') -%}
          {%- set p = expand(w.person) | first | default(none) -%}
          {%- set st = expand(w.sensor) | first | default(none) -%}
          {%- if st is not none -%}
            {%- set a = st.state | as_datetime(none) -%}
            {%- set a = a | as_local if a is not none else none -%}
            {%- if a is not none and a.date() == t.date() and 4 <= a.hour < 10 -%}
              {%- if daheim -%}
                {%- set ns.heute = true -%}
                {%- if -10 * m <= t - a < 0 * m or 20 * m <= t - a < 35 * m -%}
                  {%- set ns.bedarf = true -%}
                {%- endif -%}
              {%- endif -%}
            {%- else -%}
              {%- set lc = st.last_changed | as_local -%}
              {%- if lc.date() == t.date() and lc.hour >= 4 -%}
                {%- if daheim or (p is not none and p.last_changed > st.last_changed) -%}
                  {%- set ns.heute = true -%}
                {%- endif -%}
                {%- if daheim and 20 * m <= t - lc < 35 * m -%}
                  {%- set ns.bedarf = true -%}
                {%- endif -%}
              {%- endif -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if ns.bedarf -%}
          {%- set ns.phase = 'wecker' -%}
        {%- elif not ns.heute and '07:00' <= hm < '10:00' -%}
          {%- set ns.phase = 'ohne_wecker' -%}
        {%- endif -%}
      {%- elif not werktag and '07:00' <= hm < '10:00' -%}
        {%- set ns.phase = 'wochenende' -%}
      {%- endif -%}
      {{- ns.phase -}}
  conditions:
  - condition: template
    value_template: "{{ phase != '' }}"
  - condition: numeric_state
    entity_id: zone.home
    above: 0
  # Frühestens 30 min (Wecker, Ankunft) bzw. 60 min (feste Zeiten) nach dem
  # letzten Start: 3 min Lauf + 26 bzw. 56 min Pause, der 5-min-Takt rundet auf.
  - condition: state
    entity_id: switch.umwalzpumpe
    state: 'off'
  - condition: template
    value_template: >-
      {{ now() - states.switch.umwalzpumpe.last_changed
         >= timedelta(minutes=26 if phase in ['wecker', 'ankunft'] else 56) }}
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.umwalzpumpe
  - delay: '00:03:00'
  - action: switch.turn_off
    target:
      entity_id: switch.umwalzpumpe
  mode: single
  max_exceeded: silent

- id: umwaelzpumpe_sicherheit_aus
  alias: Umwälzpumpe - Sicherheitsabschaltung nach 10 min
  description: Schaltet die Pumpe ab, falls der Aus-Befehl verloren ging
    (HA-Neustart während des Laufs, Eve kurz unavailable, manuell eingeschaltet).
  triggers:
  - trigger: state
    entity_id: switch.umwalzpumpe
    to: 'on'
    for: '00:10:00'
  - trigger: time_pattern
    minutes: /15
  conditions:
  - condition: state
    entity_id: switch.umwalzpumpe
    state: 'on'
    for: '00:10:00'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.umwalzpumpe
  mode: single
