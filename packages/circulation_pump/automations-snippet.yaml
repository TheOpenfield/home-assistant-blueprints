# ============================================================
# DIESE AUTOMATIONEN ANS ENDE DEINER automations.yaml ANFÜGEN
# (nach dem letzten bestehenden "- id: ..." Block)
#
# Danach: Entwicklerwerkzeuge -> YAML-Konfiguration neu laden -> Automationen.
# Kein Core-Neustart nötig.
#
# Anzupassen an die eigene Installation:
#   switch.umwalzpumpe                  -> Steckdose der Zirkulationspumpe
#   person.jaybe / person.sari          -> die eigenen Personen
#   sensor.op13_vpn_next_alarm,
#   sensor.pixel_10a_next_alarm         -> Next-alarm-Sensoren der Companion-App
# ============================================================

- id: umwaelzpumpe_takt
  alias: Umwälzpumpe - Wecker und Ankunft
  description: Warmwasser-Zirkulation für 3 min, 10 min vor jedem Wecker bis
    12 Uhr, wenn dessen Besitzer daheim ist, und bei Rückkehr nach mindestens
    30 min Abwesenheit. Frühestens 30 min nach dem letzten Start.
  triggers:
  # Die ID ist die Person, der der Wecker gehört.
  - trigger: time
    at:
      entity_id: sensor.op13_vpn_next_alarm
      offset: '-00:10:00'
    id: person.jaybe
  - trigger: time
    at:
      entity_id: sensor.pixel_10a_next_alarm
      offset: '-00:10:00'
    id: person.sari
  - trigger: state
    entity_id:
    - person.jaybe
    - person.sari
    from: not_home
    to: home
    id: ankunft
  conditions:
  - condition: state
    entity_id: switch.umwalzpumpe
    state: 'off'
  # Frühestens 30 min nach dem letzten Start. 1 min Toleranz, damit zwei
  # Wecker im Abstand von genau 30 min beide zählen.
  - condition: template
    value_template: >-
      {{ as_timestamp(now()) - as_timestamp(this.attributes.last_triggered, 0)
         >= 29 * 60 }}
  - or:
    - and:
      - condition: trigger
        id:
        - person.jaybe
        - person.sari
      - condition: time
        before: '12:00:00'
      - condition: template
        value_template: "{{ is_state(trigger.id, 'home') }}"
    - and:
      - condition: trigger
        id: ankunft
      - condition: template
        value_template: >-
          {{ now() - trigger.from_state.last_changed >= timedelta(minutes=30) }}
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.umwalzpumpe
  - delay: '00:03:00'
  - action: switch.turn_off
    target:
      entity_id: switch.umwalzpumpe
  mode: single
  max_exceeded: silent

- id: umwaelzpumpe_sicherheit_aus
  alias: Umwälzpumpe - Sicherheitsabschaltung nach 10 min
  description: Schaltet die Pumpe ab, falls der Aus-Befehl verloren ging
    (HA-Neustart während des Laufs, Eve kurz unavailable, manuell eingeschaltet).
  triggers:
  - trigger: state
    entity_id: switch.umwalzpumpe
    to: 'on'
    for: '00:10:00'
  - trigger: time_pattern
    minutes: /15
  conditions:
  - condition: state
    entity_id: switch.umwalzpumpe
    state: 'on'
    for: '00:10:00'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.umwalzpumpe
  mode: single
